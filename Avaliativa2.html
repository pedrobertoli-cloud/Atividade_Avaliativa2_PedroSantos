<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliativa 2</title>
    <link rel="stylesheet" href="_css/estilo.css">
</head>

<body>
    <h2>Jogo CyberPunk</h2>
    <form>
        <fieldset>
            <h1>Dados Pessoais:</h1>
            <p></p>
            <label>Nome completo:<br><input type="text" name="nome" placeholder="Digite seu nome completo"></label>
            <label>Idade:<input type="number" na6ie567ime="idade" placeholder="Ex: 18"></label>
            <p></p>
            <label>E-mail:<br><input type="text" name="email" placeholder="seuemail@exemplo.com"></label>
            <label>Telefone:<input type="number" name="telefone" placeholder="(00)00000-0000"></label>
            <p></p>
            <label>Digite sua Cidade:<br><input type="text" name="cidade" placeholder="Digite sua Cidade"></label>
        </fieldset>
        <hr>
        <fieldset class="field2">
            <h2 class="fieldh2">Perguntas Rápidas:</h2>
            <label class="field2">Qual foi o Motivo de você baixar o jogo?</label>
            <select>
                <option>Escolha uma Opção</option>
                <option>Um Amigo Recomendou</option>
                <option>Achei Interessante</option>
                <option>Estava no Tédio </option>
                <option>Outro</option>
            </select>
            <p></p>
            <label>Com qual Frequência você Pretende jogar?:</label><br>
            <input type="radio" name="opcao" value="opcao1">Manhã<br>
            <input type="radio" name="opcao" value="opcao2">Tarde<br>
            <input type="radio" name="opcao" value="opcao3">Noite<br>
            <p></p>
            <label>Você já tem experiência com jogos distópicos?</label><br>
            <input type="radio" name="sim" value="opcao1">Sim<br>
            <input type="radio" name="nao" value="opcao2">Não<br>
            <p></p>
            <label>Quais jogos distópicos você já jogou?</label><br>
            <input type="checkbox" name="jogo1" value="opcao1">The Last of Us<br>
            <input type="checkbox" name="jogo2" value="opcao2">Detroit: Become Human<br>
            <input type="checkbox" name="jogo3" value="opcao3">BioShock<br>
            <input type="checkbox" name="jogo3" value="opcao4">Fallout 4<br>
            <input type="checkbox" name="jogo4" value="opcao5">Outros<br>
        </fieldset>
        <hr>
        <fieldset>
            <h2>Faça Alguns Comentários sobre o que você espera do jogo:</h2>
            <textarea></textarea>
        </fieldset>
        <input class="enviar" type="submit" value="Enviar">
        <input class="reset" type="reset" value="Redefinir">
    </form>
    <footer>Me da 100 Roberto :)</footer>
</body>

</html>
